ge" transform="translate(600, 145) translate(0, -18)"><path fill="url(#emeraldShield)" d="M 0 -28 L 24 -16 L 24 10 C 24 24 0 34 0 34 C 0 34 -24 24 -24 10 L -24 -16 Z" opacity=".95"/><path fill="#064E3B" d="M 0 -23 L 19 -13 L 19 8 C 19 19 0 28 0 28 C 0 28 -19 19 -19 8 L -19 -13 Z" opacity=".8"/><rect width="14" height="12" x="-7" y="-2" fill="url(#goldLock)" rx="2"/><path fill="none" stroke="#FDE68A" stroke-linecap="round" stroke-width="2" d="M -5 -2 L -5 -7 C -5 -10 5 -10 5 -7 L 5 -2"/><circle cx="0" cy="3" r="1.5" fill="#78350F"/></g><text x="0" y="52" fill="#FFF" class="brand-title" filter="url(#shadowFilter)" text-anchor="middle" transform="translate(600, 145)">Awesome <tspan fill="url(#cyberCyan)">Immutable Backup Storage</tspan></text><text x="0" y="86" fill="#F8FAFC" class="brand-title" font-size="28" opacity=".95" text-anchor="middle" transform="translate(600, 145)">&amp; <tspan fill="#34D399">WORM Locking</tspan></text></g><text x="600" y="270" fill="#94A3B8" class="brand-subtitle" text-anchor="middle">Curated Guide to <tspan fill="#38BDF8" font-weight="600">Write-Once-Read-Many (WORM)</tspan>, Object Lock, Air-Gapped Retention &amp; Hardened Vaults</text><g id="feature-pills"><g class="pill-1" transform="translate(600, 335) translate(-390, 0)"><rect width="150" height="36" x="-75" y="-18" fill="#0F172A" stroke="#00F2FE" stroke-opacity=".8" stroke-width="1.2" filter="url(#shadowFilter)" rx="18"/><circle cx="-55" cy="0" r="4" fill="#00F2FE"/><text x="-43" y="4" fill="#E2E8F0" class="pill-text">Ransomware-Proof</text></g><g class="pill-2" transform="translate(600, 335) translate(-130, 0)"><rect width="190" height="36" x="-95" y="-18" fill="#0F172A" stroke="#10B981" stroke-opacity=".8" stroke-width="1.2" filter="url(#shadowFilter)" rx="18"/><circle cx="-75" cy="0" r="4" fill="#10B981"/><text x="-63" y="4" fill="#E2E8F0" class="pill-text">S3 Object Lock &amp; WORM</text></g><g class="pill-3" transform="translate(600, 335) translate(130, 0)"><rect width="190" hei